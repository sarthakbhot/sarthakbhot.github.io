<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Page not found — Sarthak Bhot</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=47" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sb-theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="e404">
    <div class="e404-card">
      <div class="terminal" style="margin:0 auto;text-align:left" role="img" aria-label="Terminal showing a command not found error">
        <div class="term-bar"><span></span><span></span><span></span></div>
        <div class="term-body">
          <div class="term-line"><span class="prompt">sarthak:~$</span> cd /this-page</div>
          <div class="term-line" style="color:#ff7b72">bash: cd: /this-page: No such file or directory</div>
          <div class="term-line"><span class="prompt">sarthak:~$</span> <span class="caret"></span></div>
        </div>
      </div>
      <h1>Page not found.</h1>
      <p>That path isn't on this site.</p>
      <a href="/" class="btn btn-primary">Back home</a>
    </div>
  </main>
</body>
</html>
